
spring:
  application:
    name: employee
  main:
    lazy-initialization: true
  datasource:
    url: jdbc:mysql://localhost:3306/employee?useSSL=true&serverTimezone=UTC&&createDatabaseIfNotExist=true
    username: root
    password: mysql@237
    driver-class-name: com.mysql.cj.jdbc.Driver
#    hikari:
#      minimum-idle: 5
#      maximum-pool-size: 20
#      connection-timeout: 30000
#      idle-timeout: 30000
#      leak-detection-threshold: 15000
#      max-lifetime: 2000000
  jpa:
    generate-ddl: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

# Logging configuration for structured concurrency
logging:
  level:
    com.example.employee.domain.service.concurrency: DEBUG
    com.example.employee.domain.service.salary: INFO
    com.example.employee.domain.service.department: INFO
    com.example.employee.api.StructuredConcurrencyController: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Application-specific properties for structured concurrency
employee:
  concurrency:
    default-timeout-seconds: 5
    enable-structured-concurrency: true
    max-concurrent-tasks: 10

